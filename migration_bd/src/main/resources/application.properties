spring.application.name=db-migrator


spring.main.web-application-type=none
spring.main.banner-mode=off


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

migrator.retry-delay-seconds=10
